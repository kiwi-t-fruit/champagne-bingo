<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champagne Trip · June 2025</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #9a7a45;
    --gold-light: #b89660;
    --gold-rule: #d4b86a;
    --cream: #faf7f2;
    --ink: #2a2218;
    --muted: #9a8e7e;
    --bg: #ede8de;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'EB Garamond', serif;
    padding: 24px 20px;
    gap: 0;
  }

  body::before {
    content: '';
    display: block;
    height: 5px;
    background: linear-gradient(90deg, var(--gold-rule), #e8d08a, var(--gold-rule));
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
  }

  body::after {
    content: '';
    display: block;
    height: 5px;
    background: linear-gradient(90deg, var(--gold-rule), #e8d08a, var(--gold-rule));
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
  }

  .card {
    width: min(420px, 100%);
    background: var(--cream);
    border: 1px solid rgba(154,122,69,0.22);
    box-shadow: 0 8px 48px rgba(0,0,0,0.09);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
  }

  /* Noise texture */
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .card-inner {
    position: relative;
    z-index: 1;
    padding: 36px 32px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Champagne glass illustration */
  .glass-icon {
    font-size: 3rem;
    line-height: 1;
    margin-bottom: 16px;
    filter: drop-shadow(0 2px 8px rgba(154,122,69,0.25));
  }

  .eyebrow {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--gold);
    margin-bottom: 10px;
    text-align: center;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.9rem, 7vw, 2.6rem);
    font-weight: 700;
    font-style: italic;
    color: var(--ink);
    text-align: center;
    line-height: 1.1;
    margin-bottom: 6px;
  }

  h1 span { color: var(--gold); }

  .tagline {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 6px;
  }

  .rule {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(154,122,69,0.3), transparent);
    margin: 22px 0;
  }

  /* Date strip */
  .date-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .date-line {
    flex: 1;
    height: 1px;
    background: rgba(154,122,69,0.2);
  }

  .date-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Nav buttons */
  .nav-buttons {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(154,122,69,0.2);
    text-decoration: none;
    color: var(--ink);
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .nav-btn::after {
    content: '→';
    position: absolute;
    right: 18px;
    font-family: 'EB Garamond', serif;
    font-size: 1.1rem;
    color: var(--gold-light);
    transition: transform 0.2s, opacity 0.2s;
    opacity: 0.6;
  }

  .nav-btn:hover {
    background: rgba(154,122,69,0.07);
    border-color: rgba(154,122,69,0.4);
    transform: translateX(3px);
  }

  .nav-btn:hover::after {
    transform: translateX(4px);
    opacity: 1;
  }

  .btn-emoji {
    font-size: 1.6rem;
    flex-shrink: 0;
    filter: drop-shadow(0 1px 3px rgba(154,122,69,0.2));
  }

  .btn-text { flex: 1; }

  .btn-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    font-style: italic;
    color: var(--ink);
    display: block;
    margin-bottom: 2px;
  }

  .btn-desc {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 0.78rem;
    color: var(--muted);
    display: block;
  }

  /* Footer */
  .footer-text {
    margin-top: 24px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: rgba(154,122,69,0.4);
    text-align: center;
  }

  /* Bubbles */
  .bubbles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    bottom: -40px;
    border-radius: 50%;
    border: 1px solid rgba(154,122,69,0.15);
    background: radial-gradient(circle at 30% 30%, rgba(184,150,96,0.15), rgba(154,122,69,0.03));
    animation: rise linear infinite;
  }
  @keyframes rise {
    to { transform: translateY(-105vh) translateX(var(--drift)); opacity: 0; }
  }
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>

<div class="card">
  <div class="card-inner">

    <div class="glass-icon">🥂</div>

    <div class="eyebrow">Reims &amp; Épernay</div>
    <h1>Champagne <span>Trip</span></h1>
    <p class="tagline">June 2025 · Three of us · No regrets</p>

    <div class="rule"></div>

    <div class="date-strip">
      <div class="date-line"></div>
      <div class="date-text">Your trip companion</div>
      <div class="date-line"></div>
    </div>

    <div class="nav-buttons">
      <a class="nav-btn" href="bingo.html">
        <span class="btn-emoji">🎯</span>
        <span class="btn-text">
          <span class="btn-title">Bingo Card</span>
          <span class="btn-desc">Mark off the classics as they happen</span>
        </span>
      </a>
      <a class="nav-btn" href="champagne-tracker.html">
        <span class="btn-emoji">🍾</span>
        <span class="btn-text">
          <span class="btn-title">Bottle Tracker</span>
          <span class="btn-desc">Log every glass and bottle of the trip</span>
        </span>
      </a>
      <a class="nav-btn" href="champagne-scorecard.html">
        <span class="btn-emoji">🏆</span>
        <span class="btn-text">
          <span class="btn-title">House Scorecard</span>
          <span class="btn-desc">Rate each champagne house out of five</span>
        </span>
      </a>
    </div>

  </div>
</div>

<div class="footer-text">#ChampagneRealness · kiwi-t-fruit</div>

<script>
  // Gentle rising bubbles
  const wrap = document.getElementById('bubbles');
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 5 + Math.random() * 14;
    const left = Math.random() * 100;
    const delay = Math.random() * 14;
    const dur = 8 + Math.random() * 12;
    const drift = (Math.random() - 0.5) * 50 + 'px';
    b.style.cssText = `width:${size}px;height:${size}px;left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s;--drift:${drift}`;
    wrap.appendChild(b);
  }
</script>
</body>
</html>
