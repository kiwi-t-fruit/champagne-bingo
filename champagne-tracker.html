<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champagne Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #9a7a45;
    --gold-light: #b89660;
    --cream: #faf7f2;
    --ink: #2a2218;
    --muted: #9a8e7e;
  }

  body {
    background: #ede8de;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'EB Garamond', serif;
    padding: 20px;
    gap: 24px;
  }

  .card {
    width: min(440px, 100%);
    background: var(--cream);
    border: 1px solid rgba(154,122,69,0.2);
    box-shadow: 0 4px 32px rgba(0,0,0,0.07);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .card-inner {
    position: relative;
    z-index: 1;
    padding: 26px 26px 22px;
  }

  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .campaign-tag {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--gold);
  }

  .day-label {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    margin-top: 4px;
  }

  .day-label em { font-style: italic; font-weight: 400; color: var(--gold); }

  .date-label {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .location-pill {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    padding: 5px 12px;
    border: 1px solid rgba(154,122,69,0.3);
    color: var(--gold);
    background: rgba(154,122,69,0.06);
  }

  .rule {
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(154,122,69,0.25), transparent);
    margin: 14px 0;
  }

  .counters {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    gap: 0;
    margin: 4px 0 8px;
  }

  .counter-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 10px 12px;
  }

  .counter-divider {
    background: linear-gradient(to bottom, transparent, rgba(154,122,69,0.2), transparent);
    margin: 8px 0;
  }

  .counter-emoji {
    font-size: 28px;
    margin-bottom: 4px;
    filter: drop-shadow(0 1px 3px rgba(154,122,69,0.2));
  }

  .counter-type {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .counter-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    line-height: 0.9;
    background: linear-gradient(160deg, #b89660 0%, #9a7a45 50%, #6a5030 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .counter-sub {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }

  .icons-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    margin-top: 8px;
    min-height: 28px;
  }

  .icon-item {
    font-size: 18px;
    line-height: 1;
    animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes popIn {
    from { transform: scale(0) rotate(-15deg); opacity: 0; }
    to   { transform: scale(1) rotate(0);      opacity: 1; }
  }

  .totals-bar {
    background: rgba(154,122,69,0.07);
    border: 1px solid rgba(154,122,69,0.14);
    padding: 11px 16px;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .total-item { text-align: center; }

  .total-item-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--muted);
    display: block;
  }

  .total-item-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    line-height: 1;
    background: linear-gradient(135deg, #b89660, #9a7a45);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .total-divider {
    width: 1px;
    height: 32px;
    background: rgba(154,122,69,0.2);
    margin: 0 auto;
  }

  .tag-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  .tag {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: rgba(154,122,69,0.6);
    padding: 3px 7px;
    border: 1px solid rgba(154,122,69,0.15);
  }

  /* Sync bar */
  .sync-bar {
    width: min(440px, 100%);
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(154,122,69,0.15);
    border-bottom: none;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
  }
  .sync-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ccc;
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .sync-dot.synced  { background: #4a9e2e; }
  .sync-dot.syncing { background: var(--gold-light); animation: pulse 1s infinite; }
  .sync-dot.error   { background: #c0392b; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .controls {
    width: min(440px, 100%);
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(154,122,69,0.15);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .controls-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--muted);
  }

  .ctrl-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  label {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--muted);
    min-width: 96px;
    flex-shrink: 0;
  }

  input, select {
    flex: 1;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(154,122,69,0.25);
    color: var(--ink);
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    padding: 7px 10px;
    outline: none;
    -webkit-appearance: none;
  }

  input:focus, select:focus { border-color: rgba(154,122,69,0.5); }
  select option { background: #faf7f2; color: var(--ink); }

  .section-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(154,122,69,0.5);
    padding-bottom: 2px;
    border-bottom: 1px solid rgba(154,122,69,0.1);
  }

  .btn-group {
    display: flex;
    gap: 6px;
  }

  .btn {
    flex: 1;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    padding: 9px 6px;
    border: none;
    cursor: pointer;
    transition: all 0.18s;
  }

  .btn-add-b { background: linear-gradient(135deg, #b89660, #9a7a45); color: #faf7f2; }
  .btn-add-g { background: linear-gradient(135deg, #a8b89a, #7a9870); color: #faf7f2; }
  .btn-rem   { background: transparent; border: 1px solid rgba(154,122,69,0.25); color: var(--muted); }
  .btn-reset { background: transparent; border: 1px solid rgba(220,80,80,0.2); color: rgba(200,80,80,0.5); font-size: 10px; }

  .btn-add-b:hover, .btn-add-g:hover { filter: brightness(1.08); }
  .btn-rem:hover   { border-color: rgba(154,122,69,0.5); color: var(--gold); }
  .btn-reset:hover { border-color: rgba(220,80,80,0.4); color: rgba(200,80,80,0.8); }

  .hint {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 12px;
    color: rgba(154,122,69,0.45);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="card-inner">
    <div class="header">
      <div>
        <div class="campaign-tag">#ChampagneRealness</div>
        <div class="day-label" id="dayLabel">Day <em>1</em></div>
        <div class="date-label" id="dateLabel">Saturday 30th May</div>
      </div>
      <div class="location-pill" id="locationPill">Reims</div>
    </div>

    <div class="rule"></div>

    <div class="counters">
      <div class="counter-col">
        <div class="counter-emoji">🍾</div>
        <div class="counter-type">Bottles</div>
        <div class="counter-number" id="bottleCount">0</div>
        <div class="counter-sub">today</div>
        <div class="icons-row" id="bottleIcons"></div>
      </div>
      <div class="counter-divider"></div>
      <div class="counter-col">
        <div class="counter-emoji">🥂</div>
        <div class="counter-type">Glasses</div>
        <div class="counter-number" id="glassCount">0</div>
        <div class="counter-sub">today</div>
        <div class="icons-row" id="glassIcons"></div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="totals-bar">
      <div class="total-item">
        <span class="total-item-label">Trip Bottles 🍾</span>
        <div class="total-item-num" id="totalBottles">0</div>
      </div>
      <div class="total-divider"></div>
      <div class="total-item">
        <span class="total-item-label">Trip Glasses 🥂</span>
        <div class="total-item-num" id="totalGlasses">0</div>
      </div>
    </div>

    <div class="tag-row" id="tagRow">
      <div class="tag">#Reims</div>
      <div class="tag">#ChampagneRealness</div>
      <div class="tag">#Eurostar</div>
    </div>
  </div>
</div>

<div class="sync-bar">
  <div class="sync-dot" id="syncDot"></div>
  <span id="syncText">Connecting...</span>
</div>

<div class="controls">
  <div class="controls-title">Update your tracker</div>

  <div class="ctrl-row">
    <label>Day</label>
    <select id="daySelect" onchange="updateDay()">
      <option value="1">Day 1 — Saturday 30th</option>
      <option value="2">Day 2 — Sunday 31st</option>
      <option value="3">Day 3 — Monday 1st June</option>
      <option value="4">Day 4 — Tuesday 2nd June</option>
    </select>
  </div>

  <div class="ctrl-row">
    <label>Location</label>
    <input id="locationInput" type="text" value="Reims" oninput="updateLocation()" />
  </div>

  <div class="section-label">🍾 Bottles</div>
  <div class="btn-group">
    <button class="btn btn-add-b" onclick="add('bottles')">+ Bottle</button>
    <button class="btn btn-rem"   onclick="remove('bottles')">− Bottle</button>
  </div>

  <div class="section-label">🥂 Glasses</div>
  <div class="btn-group">
    <button class="btn btn-add-g" onclick="add('glasses')">+ Glass</button>
    <button class="btn btn-rem"   onclick="remove('glasses')">− Glass</button>
  </div>

  <div class="btn-group">
    <button class="btn btn-reset" onclick="resetDay()">Reset Today</button>
  </div>
</div>

<p class="hint">Screenshot the card above to share to your stories 🥂</p>

<script>
  const days = [
    { label:"Day 1", date:"Saturday 30th May",  tags:["#Reims","#ChampagneRealness","#Eurostar"] },
    { label:"Day 2", date:"Sunday 31st May",     tags:["#Pommery","#Taittinger","#VeuveClicquot"] },
    { label:"Day 3", date:"Monday 1st June",     tags:["#Épernay","#AvenueDeChampagne","#Moët"] },
    { label:"Day 4", date:"Tuesday 2nd June",    tags:["#Krug","#Reims","#LastSip"] },
  ];

  const BIN_ID  = '6a1b6120ddf5aa59f779c1e2';
  const API_KEY = '$2a$10$wYu.VAGvonHB2HvkB0czn.UyqmgWhX/i5xsL1dgq2gQjumApDjASy';
  const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
  const HEADERS = {
    'Content-Type': 'application/json',
    'X-Master-Key': API_KEY,
    'X-Bin-Versioning': 'false',
  };

  let state = { todayBottles:0, todayGlasses:0, tripBottles:0, tripGlasses:0, day:1, location:'Reims' };
  let isSaving = false;

  function setSyncStatus(s, text) {
    document.getElementById('syncDot').className = 'sync-dot ' + s;
    document.getElementById('syncText').textContent = text;
  }

  async function loadState() {
    try {
      setSyncStatus('syncing', 'Loading...');
      const res = await fetch(BASE_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
      const data = await res.json();
      state = data.record;
      applyState();
      setSyncStatus('synced', 'Live · tap to update');
    } catch(e) {
      setSyncStatus('error', 'Could not connect');
    }
  }

  async function saveState() {
    if (isSaving) return;
    isSaving = true;
    setSyncStatus('syncing', 'Saving...');
    try {
      await fetch(BASE_URL, {
        method: 'PUT',
        headers: HEADERS,
        body: JSON.stringify(state),
      });
      setSyncStatus('synced', 'Saved · ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
    } catch(e) {
      setSyncStatus('error', 'Save failed - check connection');
    }
    isSaving = false;
  }

  function applyState() {
    document.getElementById('daySelect').value = state.day || 1;
    document.getElementById('locationInput').value = state.location || 'Reims';
    updateDay();
    updateLocation();
    render();
  }

  function updateDay() {
    const idx = parseInt(document.getElementById('daySelect').value) - 1;
    state.day = idx + 1;
    const d = days[idx];
    document.getElementById('dayLabel').innerHTML = `Day <em>${idx+1}</em>`;
    document.getElementById('dateLabel').textContent = d.date;
    document.getElementById('tagRow').innerHTML = d.tags.map(t=>`<div class="tag">${t}</div>`).join('');
  }

  function updateLocation() {
    const val = document.getElementById('locationInput').value || 'Champagne';
    state.location = val;
    document.getElementById('locationPill').textContent = val;
  }

  function add(type) {
    if (type === 'bottles') { state.todayBottles++; state.tripBottles++; }
    else { state.todayGlasses++; state.tripGlasses++; }
    render();
    saveState();
  }

  function remove(type) {
    if (type === 'bottles' && state.todayBottles > 0) { state.todayBottles--; state.tripBottles = Math.max(0, state.tripBottles-1); }
    if (type === 'glasses' && state.todayGlasses > 0) { state.todayGlasses--; state.tripGlasses = Math.max(0, state.tripGlasses-1); }
    render();
    saveState();
  }

  function resetDay() {
    state.todayBottles = 0;
    state.todayGlasses = 0;
    render();
    saveState();
  }

  function renderIcons(containerId, count, emoji, max) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    const show = Math.min(count, max);
    for (let i = 0; i < show; i++) {
      const s = document.createElement('span');
      s.className = 'icon-item';
      s.textContent = emoji;
      s.style.animationDelay = `${i * 0.05}s`;
      el.appendChild(s);
    }
    if (count > max) {
      const more = document.createElement('span');
      more.className = 'icon-item';
      more.style.fontSize = '12px';
      more.style.color = 'var(--gold)';
      more.style.fontFamily = "'Bebas Neue',sans-serif";
      more.textContent = `+${count - max}`;
      el.appendChild(more);
    }
  }

  function render() {
    document.getElementById('bottleCount').textContent = state.todayBottles;
    document.getElementById('glassCount').textContent  = state.todayGlasses;
    document.getElementById('totalBottles').textContent = state.tripBottles;
    document.getElementById('totalGlasses').textContent = state.tripGlasses;
    renderIcons('bottleIcons', state.todayBottles, '🍾', 6);
    renderIcons('glassIcons',  state.todayGlasses, '🥂', 8);
  }

  // Poll every 10 seconds for updates from other people
  setInterval(async () => {
    if (isSaving) return;
    try {
      const res = await fetch(BASE_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
      const data = await res.json();
      const remote = data.record;
      if (JSON.stringify(remote) !== JSON.stringify(state)) {
        state = remote;
        applyState();
        setSyncStatus('synced', 'Updated · ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
      }
    } catch(e) {}
  }, 10000);

  loadState();
</script>
</body>
</html>
